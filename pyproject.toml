[project]
name = "image2travel-mcp"
version = "0.1.0"
description = "MCP server turning photos into realistic travel plans"
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
image2travel-mcp = "image2travel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image2travel"]
